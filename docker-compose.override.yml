# LOCAL DEVELOPMENT ONLY. Passwords here are local defaults, overridable from the shell or a git-ignored .env file.
services:
  orders-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Database=Server=sqlserver;Database=OrdersDb;User Id=sa;Password=${SA_PASSWORD:-LocalDev_Passw0rd!};Encrypt=False;TrustServerCertificate=True
      - RabbitMqOptions__Host=amqp://rabbitmq:5672
    ports:
      - "4401:8080"

  api-gateway:
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__orders-cluster__Destinations__orders__Address=http://orders-api:8080
    ports:
      - "4400:8080"

  sqlserver:
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-LocalDev_Passw0rd!}
    ports:
      - "1433:1433"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  mongo:
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-LocalDev_Passw0rd!}
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"
      - "8001:8001"

  postgres:
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-LocalDev_Passw0rd!}
    ports:
      - "5432:5432"

  hasura:
    environment:
      - HASURA_GRAPHQL_DATABASE_URL=postgres://app:${POSTGRES_PASSWORD:-LocalDev_Passw0rd!}@postgres:5432/postgres
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_ADMIN_SECRET:-local-dev-secret}
    ports:
      - "4490:8080"
